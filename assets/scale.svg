<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-label="Music rating scale pyramid: Sleeper, Heater, Fire, Banger, Certified Banger, Certified Platinum Banger, Generational Banger" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
  <defs>
    <filter id="glow" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="540" rx="20" fill="#0a0d12"/>

  <!-- apex glow -->
  <polygon points="280,42 520,42 551.6,102 248.4,102" fill="#3fa37a" opacity="0.5" filter="url(#glow)"/>

  <!-- Generational Banger -->
  <polygon points="280,42 520,42 551.6,102 248.4,102" fill="#1f6b4d" stroke="#3fa37a" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="400" y="79" fill="#e8f5ee">Generational Banger</text>

  <!-- Certified Platinum Banger -->
  <polygon points="245.3,108 554.7,108 586.3,168 213.7,168" fill="#1c5a4d" stroke="#1c5a4d" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="145" fill="#d3e6df">Certified Platinum Banger</text>

  <!-- Certified Banger -->
  <polygon points="210.5,174 589.5,174 621.1,234 178.9,234" fill="#1a4a4f" stroke="#1a4a4f" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="211" fill="#c9dcd8">Certified Banger</text>

  <!-- Banger -->
  <polygon points="175.8,240 624.2,240 655.8,300 144.2,300" fill="#193b4c" stroke="#193b4c" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="277" fill="#bfd2d2">Banger</text>

  <!-- Fire -->
  <polygon points="141.1,306 658.9,306 690.5,366 109.5,366" fill="#172c42" stroke="#172c42" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="343" fill="#b4c7cc">Fire</text>

  <!-- Heater -->
  <polygon points="106.3,372 693.7,372 725.3,432 74.7,432" fill="#141f31" stroke="#141f31" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="409" fill="#a9bcc6">Heater</text>

  <!-- Sleeper: before the ladder -->
  <polygon points="71.6,438 728.4,438 760,498 40,498" fill="#0d1219" stroke="#33445a" stroke-width="1.5" stroke-dasharray="8 7" stroke-linejoin="round"/>
  <text x="400" y="475" fill="#6f8398">Sleeper</text>
</svg>

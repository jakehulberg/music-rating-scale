<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Music Rating Scale</title>
  <desc id="d">Six ascending steps. Sleeper is the entry state before the ladder. The five rungs are Heater, Banger, Certified Banger, Certified Platinum Banger, and Generational Banger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1116"/>
      <stop offset="1" stop-color="#1b1e28"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#c7d2de"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="880" height="600" rx="20" fill="url(#bg)"/>

  <text x="70" y="60" font-size="26" font-weight="700" fill="#f9fafb" letter-spacing="0.5">MUSIC RATING SCALE</text>
  <text x="70" y="86" font-size="14" fill="#9ca3af">Banger is the noun. Songs enter at the bottom and move up as they prove themselves.</text>
  <text x="716" y="60" font-size="12" fill="#6b7280">v0 · work in progress</text>

  <!-- axis -->
  <line x1="44" y1="560" x2="44" y2="160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="30" y="360" font-size="11" fill="#6b7280" letter-spacing="1.5" text-anchor="middle" transform="rotate(-90 30 360)">PROVES ITSELF OVER TIME</text>

  <!-- 0 Sleeper: entry state, before the ladder -->
  <rect x="70" y="498" width="340" height="62" rx="12" fill="#1f2430" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="90" y="520" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1.5">BEFORE THE LADDER</text>
  <text x="90" y="545" font-size="20" font-weight="700" fill="#e5e7eb">Sleeper</text>
  <text x="426" y="524" font-size="13" fill="#9ca3af">You just found it. You don't know yet.</text>
  <text x="426" y="543" font-size="13" fill="#9ca3af">Could be fire. Could be nothing.</text>

  <!-- 1 Heater -->
  <rect x="118" y="426" width="340" height="62" rx="12" fill="#fbbf24"/>
  <text x="138" y="448" font-size="11" font-weight="600" fill="#78350f" letter-spacing="1.5">RUNG 1</text>
  <text x="138" y="473" font-size="20" font-weight="700" fill="#1c1917">Heater</text>
  <text x="474" y="452" font-size="13" fill="#9ca3af">New and clearly on its way.</text>
  <text x="474" y="471" font-size="13" fill="#9ca3af">"This could become a banger for sure."</text>

  <!-- 2 Banger -->
  <rect x="166" y="354" width="340" height="62" rx="12" fill="#f97316"/>
  <text x="186" y="376" font-size="11" font-weight="600" fill="#7c2d12" letter-spacing="1.5">RUNG 2</text>
  <text x="186" y="401" font-size="20" font-weight="700" fill="#1c1917">Banger</text>
  <text x="522" y="380" font-size="13" fill="#9ca3af">It hits.</text>
  <text x="522" y="399" font-size="13" fill="#9ca3af">The baseline everything above modifies.</text>

  <!-- 3 Certified Banger -->
  <rect x="214" y="282" width="340" height="62" rx="12" fill="#ef4444"/>
  <text x="234" y="304" font-size="11" font-weight="600" fill="#fecaca" letter-spacing="1.5">RUNG 3 · CERTIFIED</text>
  <text x="234" y="329" font-size="20" font-weight="700" fill="#ffffff">Certified Banger</text>
  <text x="570" y="308" font-size="13" fill="#9ca3af">Has held up over time.</text>
  <text x="570" y="327" font-size="13" fill="#9ca3af">Certified means proven.</text>

  <!-- 4 Certified Platinum Banger -->
  <rect x="262" y="210" width="340" height="62" rx="12" fill="url(#plat)"/>
  <text x="282" y="232" font-size="11" font-weight="600" fill="#475569" letter-spacing="1.5">RUNG 4 · PLATINUM</text>
  <text x="282" y="257" font-size="20" font-weight="700" fill="#0f172a">Certified Platinum Banger</text>
  <text x="618" y="236" font-size="13" fill="#9ca3af">Top of what a song earns.</text>

  <!-- 5 Generational Banger -->
  <rect x="310" y="138" width="340" height="62" rx="12" fill="url(#gen)" stroke="#fcd34d" stroke-width="2" filter="url(#glow)"/>
  <text x="330" y="160" font-size="11" font-weight="600" fill="#fde68a" letter-spacing="1.5">RUNG 5 · GENERATIONAL</text>
  <text x="330" y="185" font-size="20" font-weight="700" fill="#ffffff">Generational Banger</text>
  <text x="666" y="164" font-size="13" fill="#9ca3af">Eternal platinum.</text>
  <text x="666" y="183" font-size="13" fill="#9ca3af">Never falls off.</text>
</svg>
